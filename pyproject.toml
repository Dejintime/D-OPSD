[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-opsd"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.6", "transformers>=4.51", "peft>=0.14", "datasets", "PyYAML", "numpy", "safetensors", "tqdm"]

[project.optional-dependencies]
test = ["pytest"]
eval = ["math-verify"]

[tool.setuptools.packages.find]
include = ["dual_opsd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
